site_name: PEAT
site_description: >-
  Protein Engineering Agent Toolkit — interactive protein redesign on your own
  LLM and HPC endpoints.
site_author: Khare Lab
site_url: https://kharelab.github.io/PEAT/

repo_name: KhareLab/PEAT
repo_url: https://github.com/KhareLab/PEAT
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
  - Concepts:
    - Architecture: concepts/architecture.md
  - Reference:
    - Dependencies: reference/dependencies.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  # The Mermaid fence: this is what lets the architecture figures stay text in
  # the repo rather than becoming images nobody can edit.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

# requirements.txt lives in docs/ for the build, but is not a page.
exclude_docs: |
  requirements.txt

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KhareLab/PEAT
