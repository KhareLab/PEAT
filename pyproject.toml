[project]
name = "designagent"
version = "0.1.0"
description = "Protein redesign chat agent: LangGraph loop on flowgentic/asyncflow/rhapsody with a web chat + artifact UI"
requires-python = ">=3.11"

dependencies = [
  # --- agent loop ---
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite",
  "langchain-core>=1.6,<2",
  "langchain>=1.4,<2",
  "langchain-anthropic",
  # langchain-openai / -ollama are NOT used by us, but `import flowgentic` pulls
  # flowgentic.utils.llm_providers, which imports both at module scope.
  "langchain-openai",
  "langchain-ollama",
  # flowgentic.langGraph.fault_tolerance._default_retryable_exceptions() does
  # `try: import aiohttp ... except Exception: raise`, so aiohttp is required.
  "aiohttp",
  "python-json-logger",
  "pyyaml",
  "python-dotenv",
  # --- web ---
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pydantic>=2",
  "pydantic-settings",
  "cryptography",
  # --- data lake / artifacts ---
  "kuzu",
  "pyarrow",
  "python-docx",
  "biopython",
]

[project.optional-dependencies]
# Heavy. ChemGraph pins langgraph/langchain/pydantic exactly and pulls torch via
# mace-torch, so install deliberately and re-check the resolved set afterwards.
chem = ["chemgraph"]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[project.scripts]
designagent = "designagent.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

# NOTE: radical.asyncflow, rhapsody and flowgentic are deliberately NOT declared
# here, and there is no [tool.uv.sources] block. They are local editable installs
# from refcodes/, applied by scripts/setup.sh, which is the only supported path.
#
# Declaring them would make `uv sync` the obvious command and it cannot work:
# flowgentic pins `radical-asyncflow @ git+...@main` and `academy-py @ git+...`,
# so resolving its dependencies fetches from git and fights the local checkout.
# It is installed --no-deps, and the three packages it then lacks (academy,
# langchain-community, langchain-mcp-adapters) are not on any path we use.
#
# A previous [tool.uv.sources] block listed all three while none was a declared
# dependency, so `uv sync` resolved cleanly and silently produced an environment
# that died at `import flowgentic`. See "A fresh clone cannot be built" in
# plans/BACKLOG.md (numbering there is not stable; refer by title).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: needs a real substrate (starts an Orbit broker + endpoint)",
    "remote: submits to a real HPC endpoint (credentials from the environment)",
    "llm: calls Anthropic with a real key (costs money)",
]
# Each extra tier is opt-in, and each is excluded separately rather than lumped
# together: `-m live` must not drag in a tier that spends money or needs an
# allocation. Without this a bare `pytest` spawns a broker and runs ~25s longer,
# which is not what anyone wants from the default command. Run a tier by name:
# `pytest -m live`, `pytest -m remote`, `pytest -m llm`.
addopts = "-m 'not live and not remote and not llm'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly: with only `line-length` set, the rule set came from ruff's
# own defaults and drifted with the version (0.16 enabled 415 rules here, which
# is not a baseline anyone chose). E/F/I is the set this project is held to.
select = ["E", "F", "I"]
